# mp-cache bootstrap configuration
#
# If this file is absent, mp-cache-server starts with compiled defaults and
# writes a commented template to this path for the next run.

[service]
# Valid values: local, development, qa, staging, production
environment_name = local
service_name = mp-cache

[server]
# Absolute paths are recommended in deployment environments.
socket_path = /tmp/mp-cache/run/mp-cache.sock
pid_file_path = /tmp/mp-cache/run/mp-cache.pid
shutdown_timeout_millis = 5000

[cache]
# Maximum total in-memory cache footprint in bytes.
memory_limit_bytes = 268435456
# Default TTL in seconds used when a write request does not provide a TTL.
default_ttl_seconds = 172800
# Minimum and maximum allowed TTL values in seconds.
min_ttl_seconds = 1
max_ttl_seconds = 2592000
# Bounded key and value sizes in bytes.
max_key_bytes = 256
max_value_bytes = 1048576
# Bucket count used by the in-memory hash table.
bucket_count = 4096
# Expired-entry sweep interval in seconds.
sweep_interval_seconds = 5

[storage]
data_directory = .tmp/data
export_directory = .tmp/exports
checkpoint_path = .tmp/data/state.checkpoint
journal_path = .tmp/data/state.journal
# Maximum number of export files created in one export operation.
max_export_files = 16

[observability]
log_directory = logging
max_log_lines = 200

[security]
# Local development may use env refs. Non-local environments should prefer
# file refs that point to mounted read-only secret files.
bootstrap_admin_token_secret_ref = env:MP_SECRET_LOCAL_BOOTSTRAP_ADMIN_TOKEN
storage_key_secret_ref = env:MP_SECRET_LOCAL_STORAGE_KEY
rate_limit_requests = 240
rate_limit_window_seconds = 60
