[service]
environment_name = production
service_name = mp-cache

[server]
socket_path = /run/mp-cache/mp-cache.sock
pid_file_path = /run/mp-cache/mp-cache.pid
shutdown_timeout_millis = 5000

[cache]
memory_limit_bytes = 268435456
default_ttl_seconds = 172800
min_ttl_seconds = 1
max_ttl_seconds = 2592000
max_key_bytes = 256
max_value_bytes = 1048576
bucket_count = 4096
sweep_interval_seconds = 5

[storage]
data_directory = /var/lib/mp-cache
export_directory = /var/lib/mp-cache/exports
checkpoint_path = /var/lib/mp-cache/state.checkpoint
journal_path = /var/lib/mp-cache/state.journal
max_export_files = 16

[observability]
log_directory = /var/log/mp-cache
max_log_lines = 200

[security]
bootstrap_admin_token_secret_ref = file:/run/secrets/mp-cache/bootstrap-admin-token
storage_key_secret_ref = file:/run/secrets/mp-cache/storage-key
rate_limit_requests = 240
rate_limit_window_seconds = 60
