service_name = mp-cache
environment_name = local

[logger]
buffer_capacity = 4096
message_capacity = 1024
context_capacity = 2048
field_capacity = 8
field_key_capacity = 32
field_value_capacity = 128
format = json
pretty_output = false
log_directory = logging
file_name_prefix = mp-cache
backup_file_name_prefix = mp-cache-internal
active_streams = stdout,stderr,file

[stdout]
minimum_level = trace
maximum_level = info

[stderr]
minimum_level = warning
maximum_level = fatal

[file]
minimum_level = trace
maximum_level = fatal
