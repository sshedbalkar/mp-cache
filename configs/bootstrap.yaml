service:
  environment_name: local
  service_name: mp-cache
  build_version: "0.0.0"
server:
  socket_path: .tmp/run/mp-cache.sock
  pid_file_path: .tmp/run/mp-cache.pid
  shutdown_timeout_millis: 5000
cache:
  memory_limit_bytes: 268435456
  default_ttl_seconds: 172800
  min_ttl_seconds: 1
  max_ttl_seconds: 2592000
  max_key_bytes: 256
  max_value_bytes: 1048576
  bucket_count: 4096
  sweep_interval_seconds: 5
storage:
  data_directory: .tmp/data
  export_directory: .tmp/exports
  checkpoint_path: .tmp/data/state.checkpoint
  journal_path: .tmp/data/state.journal
  max_export_files: 16
observability:
  log_directory: logging
  max_log_lines: 200
mp_logger:
  bootstrap_path: native/mp_logger/configs/logger.bootstrap.ini
  buffer_capacity: 4096
  message_capacity: 1024
  context_capacity: 512
  field_capacity: 8
  field_key_capacity: 32
  field_value_capacity: 128
  format: json
  pretty_output: false
  log_directory: logging
  file_name_prefix: mp-cache
  backup_file_name_prefix: mp-cache-internal
  active_streams: stdout,stderr,file
  stdout_min_level: trace
  stdout_max_level: info
  stderr_min_level: warning
  stderr_max_level: fatal
  file_min_level: trace
  file_max_level: fatal
  udp_min_level: error
  udp_max_level: fatal
  udp_host: 127.0.0.1
  udp_port: 5514
security:
  bootstrap_admin_token_secret_ref: env:MP_SECRET_LOCAL_BOOTSTRAP_ADMIN_TOKEN
  storage_key_secret_ref: env:MP_SECRET_LOCAL_STORAGE_KEY
  rate_limit_requests: 240
  rate_limit_window_seconds: 60
